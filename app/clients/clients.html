
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Clients</title>
    <script src="/app/firebase-config.js"></script>
    <script src="/app/app.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/app/clients/clients.js"></script>
    <script src="/app/clients/mClient.js"></script>
    <script src="/app/clients/ajoutC.js"></script>
    <script src="/app/location/location.js"></script>

<div class="page-container fade-in">

  <div class="top-bar">
    <div>
      <div class="page-title">👤 Clients</div>
      <div class="page-subtitle">Gérez vos clients</div>
    </div>
    <a href="#!/addClient" class="btn btn-primary">+ Ajouter Client</a>
  </div>

  <div class="search-wrap">
    <input type="text" ng-model="searchText" placeholder="Rechercher un client...">
  </div>

  <div class="data-table">
    <table style="width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Numéro</th>
          <th>Adresse</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr class="fade-in" ng-repeat="client in clients | filter: searchText">
          <td><strong>{{ client.nom }}</strong></td>
          <td>{{ client.prenom }}</td>
          <td>
            <span class="badge badge-info">{{ client.Numero }}</span>
          </td>
          <td>{{ client.adresse }}</td>
          <td>
            <div style="display:flex; gap:8px;">
              <a href="#!/editClient/{{client.id}}" class="btn btn-edit">✏️ Modifier</a>
              <button class="btn btn-delete" ng-click="deleteClient(client)">🗑️ Supprimer</button>
            </div>
          </td>
        </tr>
        <tr ng-if="!clients || clients.length === 0">
          <td colspan="5">
            <div class="empty-state">
              <div class="empty-icon">👥</div>
              <div>Aucun client enregistré</div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
