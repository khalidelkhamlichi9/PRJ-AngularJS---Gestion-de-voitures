<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter Clients</title>
    <script src="/app/firebase-config.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    
    <script src="/app/clients/ajoutC.js"></script>
    <link rel="stylesheet" href="app\clients\css\bootstrap.min.css">

<div class="page-container fade-in">
  <div style="margin-bottom:24px;">
    <a href="#!/clients" class="btn btn-secondary">← Retour</a>
  </div>

  <div class="form-card">
    <div class="page-title" style="font-size:1.6em; margin-bottom:4px;">Ajouter Client</div>
    <div class="page-subtitle">Enregistrez un nouveau client</div>

    <div class="form-section-title">Informations personnelles</div>

    <div class="form-group">
      <label>Nom</label>
      <input type="text" ng-model="client.nom" placeholder="Ex: El Khamlichi">
    </div>
    <div class="form-group">
      <label>Prénom</label>
      <input type="text" ng-model="client.prenom" placeholder="Ex: Khalid">
    </div>
    <div class="form-group">
      <label>Numéro / Identifiant</label>
      <input type="text" ng-model="client.Numero" placeholder="Ex: CIN, Passeport...">
    </div>
    <div class="form-group">
      <label>Adresse</label>
      <input type="text" ng-model="client.adresse" placeholder="Ex: Rabat, Maroc">
    </div>

    <div style="display:flex; gap:12px; margin-top:28px;">
      <button class="btn btn-primary" type="button" ng-click="addClient()">✅ Ajouter</button>
      <a href="#!/clients" class="btn btn-secondary">Annuler</a>
    </div>
  </div>
</div>
