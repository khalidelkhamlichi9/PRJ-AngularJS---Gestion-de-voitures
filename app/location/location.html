<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Voiture</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/app/firebase-config.js"></script>
    <script src="/app/app.js"></script>
    <script src="/app/voiture/voiture.js"></script>
    <script src="/app/voiture/ajoutV.js"></script>
    <script src="/app/voiture/mvoiture.js"></script>
    <script src="/app/location/location.js"></script>

<div class="page-container fade-in">
  <div style="margin-bottom:24px;">
    <a href="#!/cars" class="btn btn-secondary">← Retour</a>
  </div>

  <div class="form-card" style="max-width:600px;">
    <div class="page-title" style="font-size:1.6em; margin-bottom:4px;">🔑 Louer un Véhicule</div>
    <div class="page-subtitle">Remplissez les informations de location</div>

    <div class="form-section-title">👤 Client</div>
    <div class="form-group">
      <label>Numéro / Identifiant Client</label>
      <input type="text" ng-model="client.Numero" placeholder="Ex: CIN du client" required>
    </div>

    <div class="form-section-title">🚗 Véhicule</div>
    <div class="form-group">
      <label>Numéro Voiture</label>
      <input type="text" ng-model="car.numero" readonly placeholder="Sélectionné automatiquement">
    </div>
    <div ng-if="car.marque" style="background:#f0f7ff; border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:0.9em; color:#4a6fa5;">
      🚘 <strong>{{ car.marque }} {{ car.modele }}</strong> — {{ car.type }} — {{ car.puissance }} CV
    </div>

    <div class="form-section-title">📅 Période</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div class="form-group">
        <label>Date début</label>
        <input type="date" ng-model="startDate" required>
      </div>
      <div class="form-group">
        <label>Heure début</label>
        <input type="time" ng-model="startTime" required>
      </div>
      <div class="form-group">
        <label>Date fin</label>
        <input type="date" ng-model="endDate" required>
      </div>
      <div class="form-group">
        <label>Heure fin</label>
        <input type="time" ng-model="endTime" required>
      </div>
    </div>
    <div class="form-group">
      <label>Kilométrage début</label>
      <input type="number" ng-model="startKilometers" placeholder="Ex: 12500" required>
    </div>

    <div class="form-section-title">💳 Paiement</div>
    <div class="form-group">
      <label>Type de paiement</label>
      <select ng-model="paymentType">
        <option value="cheque">🏦 Chèque</option>
        <option value="carte">💳 Carte bancaire</option>
      </select>
    </div>

    <div ng-show="paymentType === 'carte'" style="animation: fadeInUp 0.3s ease;">
      <div class="form-group">
        <label>Numéro de carte</label>
        <input type="text" ng-model="cardNumber" placeholder="**** **** **** ****" ng-required="paymentType === 'carte'">
      </div>
      <div class="form-group">
        <label>Nom sur la carte</label>
        <input type="text" ng-model="cardName" placeholder="Ex: KHALID EL KHAMLICHI" ng-required="paymentType === 'carte'">
      </div>
      <div class="form-group">
        <label>Date d'expiration</label>
        <input type="text" ng-model="cardExpiration" placeholder="MM/AA" ng-required="paymentType === 'carte'">
      </div>
    </div>

    <div style="margin-top:32px;">
      <button class="btn btn-primary" style="width:100%; justify-content:center; font-size:1em;"
        ng-click="rentLocation()"
        ng-disabled="!client.Numero || !car.numero || !startDate || !startTime || !startKilometers || !endDate || !endTime || (paymentType === 'carte' && (!cardNumber || !cardName || !cardExpiration))">
        ✅ Confirmer la Location
      </button>
    </div>
  </div>
</div>
