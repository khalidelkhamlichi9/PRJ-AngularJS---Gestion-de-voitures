<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listes des Voitures</title>
    <script src="/app/firebase-config.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    
    <script src="/app/voiture/voiture.js"></script>
    <script src="/app/voiture/ajoutV.js"></script>
    <script src="/app/voiture/mvoiture.js"></script>
    <script src="/app/location/location.js"></script>

<div class="page-container fade-in">

  <div class="top-bar">
    <div>
      <div class="page-title">🚗 Voitures</div>
      <div class="page-subtitle">Gérez votre flotte de véhicules</div>
    </div>
    <a href="#!/addCar" class="btn btn-primary">+ Ajouter Voiture</a>
  </div>

  <div class="search-wrap">
    <input type="text" ng-model="searchText" placeholder="Rechercher une voiture...">
  </div>

  <div class="data-table">
    <table style="width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th>N°</th>
          <th>Type</th>
          <th>Marque</th>
          <th>Modèle</th>
          <th>Puissance</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr class="fade-in" ng-repeat="car in cars | filter: searchText">
          <td><strong>{{ car.numero }}</strong></td>
          <td>
            <span class="badge badge-info">{{ car.type }}</span>
          </td>
          <td>{{ car.marque }}</td>
          <td>{{ car.modele }}</td>
          <td>{{ car.puissance }} CV</td>
          <td>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <a href="#!/editCar/{{car.id}}" class="btn btn-edit">✏️ Modifier</a>
              <a href="#!/location/{{car.id}}" class="btn btn-rent">🔑 Louer</a>
              <button class="btn btn-delete" ng-click="deleteCar(car)">🗑️ Supprimer</button>
            </div>
          </td>
        </tr>
        <tr ng-if="!cars || cars.length === 0">
          <td colspan="6">
            <div class="empty-state">
              <div class="empty-icon">🚘</div>
              <div>Aucune voiture enregistrée</div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
