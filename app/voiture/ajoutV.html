<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter Voiture</title>
    <script src="/app/firebase-config.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    
    <script src="/app/voiture/ajoutV.js"></script>

 <div class="page-container fade-in">
  <div style="margin-bottom:24px;">
    <a href="#!/cars" class="btn btn-secondary">← Retour</a>
  </div>

  <div class="form-card">
    <div class="page-title" style="font-size:1.6em; margin-bottom:4px;">Ajouter Voiture</div>
    <div class="page-subtitle">Enregistrez un nouveau véhicule</div>

    <div class="form-section-title">Informations du véhicule</div>

    <div class="form-group">
      <label>Numéro</label>
      <input type="text" ng-model="car.numero" placeholder="Ex: 12">
    </div>
    <div class="form-group">
      <label>Type</label>
      <input type="text" ng-model="car.type" placeholder="Ex: SUV, Berline, Citadine...">
    </div>
    <div class="form-group">
      <label>Marque</label>
      <input type="text" ng-model="car.marque" placeholder="Ex: Toyota, Mercedes...">
    </div>
    <div class="form-group">
      <label>Modèle</label>
      <input type="text" ng-model="car.modele" placeholder="Ex: Corolla, AMG...">
    </div>
    <div class="form-group">
      <label>Puissance (CV)</label>
      <input type="text" ng-model="car.puissance" placeholder="Ex: 90">
    </div>

    <div style="display:flex; gap:12px; margin-top:28px;">
      <button class="btn btn-primary" type="button" ng-click="addCar()">✅ Ajouter</button>
      <a href="#!/cars" class="btn btn-secondary">Annuler</a>
    </div>
  </div>
</div>
